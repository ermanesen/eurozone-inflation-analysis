name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Rebuild published outputs from the pinned snapshot
        run: python scripts/run_analysis.py
      - name: Execute notebook end to end
        run: jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=300 notebooks/eurozone_phillips_curve.ipynb
      - name: Run tests
        run: pytest
