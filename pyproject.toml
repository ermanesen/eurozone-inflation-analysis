[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eurozone-inflation-analysis"
version = "1.0.0"
description = "Reproducible Eurostat panel analysis of inflation and unemployment"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Erman Esen" }]
dependencies = [
  "pandas>=2.2,<3.0",
  "numpy>=1.26,<3.0",
  "matplotlib>=3.8,<4.0",
  "requests>=2.32,<3.0",
  "linearmodels>=6.1,<8.0",
  "scipy>=1.12,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
